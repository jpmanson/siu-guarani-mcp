[project]
name = "siu-guarani-mcp"
version = "0.1.0"
description = "CLI and MCP server for SIU Guarani Autogestion docente queries"
readme = "README.md"
authors = [
    { name = "Juan Pablo Manson", email = "jpmanson@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "mcp>=2.0.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
siu-guarani-mcp = "siu_guarani_mcp:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"
